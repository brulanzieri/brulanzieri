name: Generate Snake Animation

on:
  schedule:
    # Executa a cada 12 horas (no minuto 0 das horas 00:00 e 12:00 UTC)
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# Permissões necessárias para publicar a imagem gerada na branch de saída
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Gera a animação da cobrinha em SVG (temas claro e escuro)
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: brulanzieri
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Publica os arquivos gerados na branch "output"
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
